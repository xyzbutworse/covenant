[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
# submitEvidence() passes large Attestcoin proof structures through the native
# precompile call surface; the legacy codegen overflows its stack, so use the IR pipeline.
via_ir = true
fs_permissions = [{ access = "read", path = "./test" }]

[invariant]
runs = 40
depth = 64

[rpc_endpoints]
creditcoin = "${CREDITCOIN_RPC_URL}"
